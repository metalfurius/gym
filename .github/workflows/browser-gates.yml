name: Browser Gates

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read

jobs:
    browser:
        name: Browser / ${{ matrix.os }} / ${{ matrix.case }}
        runs-on: ${{ matrix.os }}
        timeout-minutes: 12
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-24.04, windows-2025]
                case: [upgrade-firefox, numeric-firefox, numeric-chromium, counting-chromium]
                include:
                    - case: upgrade-firefox
                      browser: firefox
                      script: test:e2e:upgrade:firefox
                    - case: numeric-firefox
                      browser: firefox
                      script: test:e2e:numeric
                    - case: numeric-chromium
                      browser: chromium
                      script: test:e2e:numeric
                    - case: counting-chromium
                      browser: chromium
                      script: test:e2e:session-counting
        env:
            NUMERIC_SMOKE_BROWSER: ${{ matrix.browser }}

        steps:
            - name: Checkout repository
              uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
            - name: Setup Node.js
              uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
              with:
                  node-version: '22'
                  cache: npm
            - name: Install dependencies
              run: npm ci
            - name: Install and verify the exact official browser
              timeout-minutes: 5
              run: node scripts/install-smoke-browser.mjs ${{ matrix.browser }}
              env:
                  BROWSER_SMOKE_INSTALL_RECEIPT: ${{ runner.temp }}/gym-browser-gates/${{ matrix.case }}/browser-install.json
            - name: Run the required browser case
              timeout-minutes: 3
              run: npm run ${{ matrix.script }}
              env:
                  BROWSER_SMOKE_EVIDENCE_DIR: ${{ runner.temp }}/gym-browser-gates/${{ matrix.case }}
                  UPGRADE_SMOKE_EVIDENCE_DIR: ${{ runner.temp }}/gym-browser-gates/${{ matrix.case }}
            - name: Verify real runner failure and diagnostic artifacts
              if: startsWith(matrix.case, 'numeric-')
              timeout-minutes: 3
              run: node scripts/verify-browser-smoke-negative.mjs ${{ matrix.browser }}
              env:
                  BROWSER_SMOKE_EVIDENCE_DIR: ${{ runner.temp }}/gym-browser-gates/${{ matrix.case }}
            - name: Upload browser evidence
              if: always()
              uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
              with:
                  name: browser-${{ matrix.os }}-${{ matrix.case }}-${{ github.sha }}-${{ github.run_attempt }}
                  path: ${{ runner.temp }}/gym-browser-gates/${{ matrix.case }}
                  if-no-files-found: error
