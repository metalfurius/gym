name: Tests

on:
  push:
    branches: [main, codex/gym-pwa-update-delivery-v1]
  pull_request:
    branches: [main]

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify release revision and cache manifest
        run: npm run build:check

      - name: Run two-version PWA upgrade smoke
        timeout-minutes: 3
        run: npm run test:e2e:upgrade
        env:
          UPGRADE_SMOKE_EVIDENCE_DIR: ${{ runner.temp }}/gym-upgrade-smoke/normal

      - name: Run upgrade smoke with delayed fixture bootstrap
        timeout-minutes: 3
        run: npm run test:e2e:upgrade
        env:
          UPGRADE_SMOKE_BOOTSTRAP_DELAY_MS: '1000'
          UPGRADE_SMOKE_EVIDENCE_DIR: ${{ runner.temp }}/gym-upgrade-smoke/delayed-1000

      - name: Verify cross-tab durable outbox and acknowledgement tombstones
        timeout-minutes: 4
        run: npm run test:e2e:outbox
        env:
          OUTBOX_SMOKE_EVIDENCE_DIR: ${{ runner.temp }}/gym-upgrade-smoke/outbox

      - name: Verify outbox cleanup failures retain failed evidence
        timeout-minutes: 4
        run: npm run test:e2e:outbox:negative
        env:
          OUTBOX_SMOKE_EVIDENCE_DIR: ${{ runner.temp }}/gym-upgrade-smoke/outbox-cleanup-negative

      - name: Upload Chromium upgrade and outbox evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: chromium-upgrade-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/gym-upgrade-smoke
          if-no-files-found: warn

      - name: Verify canonical browser transport bypasses active workers
        timeout-minutes: 2
        run: npm run test:e2e:canonical-transport

      - name: Run app journey tests
        run: npm run test:app

      - name: Run offline recovery/retry gate
        run: npm run test:app:offline

      - name: Fail on skipped tests
        run: npm run test:no-skips

      - name: Run tests with permanent 70% coverage gate
        run: npm run test:coverage:gate

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          fail_ci_if_error: false
          verbose: true

      - name: Test Report Annotations
        uses: dorny/test-reporter@d1b5dff021aa968b288b02285a8bf47471c5928a # v3
        # Skip for fork PRs as they don't have write permissions
        if: (success() || failure()) && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        with:
          name: Jest Tests
          path: 'coverage/junit.xml'
          reporter: jest-junit
          fail-on-error: false
