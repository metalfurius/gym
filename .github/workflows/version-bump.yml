name: Version Metadata

on:
  pull_request:
    branches: [main]
    paths:
      - 'manifest.json'
      - 'release.json'
      - 'index.html'
      - 'sw.js'
      - 'js/version-manager.js'

permissions:
  contents: read

jobs:
  version-metadata:
    name: Validate Version Metadata
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify release revision and cache manifest
        run: npm run release:check
