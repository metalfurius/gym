name: PR Labeler - trusted follow-up

on:
    workflow_run:
        workflows: [PR Labeler]
        types: [completed]

permissions:
    contents: read
    pull-requests: write

jobs:
    label-external:
        name: Label external PRs
        if: ${{ github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success' }}
        runs-on: ubuntu-latest
        steps:
            # Always use trusted default-branch code; never check out the PR or its artifacts.
            - name: Checkout default branch
              uses: actions/checkout@v6
              with:
                  ref: ${{ github.event.repository.default_branch }}
                  persist-credentials: false

            - name: Find matching pull requests
              id: resolve
              uses: actions/github-script@v8
              with:
                  script: |
                      const run = context.payload.workflow_run;
                      const headRepository = run.head_repository?.full_name;
                      const headBranch = run.head_branch;
                      const headSha = run.head_sha;
                      if (!headRepository || !headBranch || !headSha) {
                        core.warning('Workflow run did not include enough information to identify its pull request.');
                        core.setOutput('pr_numbers', '');
                        return;
                      }

                      const pullRequests = await github.paginate(github.rest.pulls.list, {
                        ...context.repo,
                        state: 'open',
                        head: `${headRepository.split('/')[0]}:${headBranch}`,
                        per_page: 100,
                      });
                      const { selectDeferredLabelerPullRequests } = await import(
                        `${process.env.GITHUB_WORKSPACE}/scripts/labeler-prs.mjs`
                      );
                      const numbers = selectDeferredLabelerPullRequests(pullRequests, {
                        repository: `${context.repo.owner}/${context.repo.repo}`,
                        headRepository,
                        headBranch,
                        headSha,
                      });
                      core.setOutput('pr_numbers', numbers.join('\n'));

            - name: Label matching pull requests
              if: ${{ steps.resolve.outputs.pr_numbers != '' }}
              uses: actions/labeler@v6
              with:
                  repo-token: ${{ secrets.GITHUB_TOKEN }}
                  configuration-path: .github/labeler.yml
                  pr-number: ${{ steps.resolve.outputs.pr_numbers }}
                  sync-labels: true
